<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Template Editor</title>

  <link rel="stylesheet" href="/static/css/marketing-template.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <header class="header-area">
    <div class="header-inner">
      <img src="{{ url_for('static', filename='images/Kisna.png') }}" alt="Kisna Logo" class="brand-logo">
      <h1>Marketing Template Editor</h1>
    </div>
  </header>

  <main class="page-shell">
    <section class="controls panel-card">
      <div class="control-row">
        <label for="stateFilter">Select State:</label>
        <select id="stateFilter">
          <option value="">-- All States --</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Gujarat">Gujarat</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Telangana">Telangana</option>
          <option value="West Bengal">West Bengal</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="Rajasthan">Rajasthan</option>
          <option value="Uttar Pradesh">Uttar Pradesh</option>
          <option value="Madhya Pradesh">Madhya Pradesh</option>
          <option value="Delhi">Delhi</option>
          <option value="Punjab">Punjab</option>
          <option value="Haryana">Haryana</option>
          <option value="Bihar">Bihar</option>
          <option value="Odisha">Odisha</option>
          <option value="Kerala">Kerala</option>
          <option value="Assam">Assam</option>
          <option value="Jharkhand">Jharkhand</option>
          <option value="Chhattisgarh">Chhattisgarh</option>
          <option value="Uttarakhand">Uttarakhand</option>
          <option value="Goa">Goa</option>
          <option value="Himachal Pradesh">Himachal Pradesh</option>
          <option value="Jammu and Kashmir">Jammu and Kashmir</option>
          <option value="Puducherry">Puducherry</option>
          <option value="Chandigarh">Chandigarh</option>
        </select>

        <label for="languageSelect">Select Language:</label>
        <select id="languageSelect">
          <option value="en" selected>English</option>
        </select>

        <span id="langColumnStatus" class="status-pill"></span>

        <div class="actions-side settings-actions">
          <button id="generateStateTemplates">Generate</button>
          <button onclick="clearAllTemplates()" class="btn-danger">Clear</button>
          <button onclick="downloadAllPerfectA4()" class="btn-dark">Download Perfect A4 PDF</button>
        </div>
      </div>

      <section class="upload-files-section">
        <h3 class="upload-files-title">Upload Files</h3>

        <div class="upload-cards-grid">
          <div class="upload-card">
            <div class="upload-card-heading">
              <span class="upload-card-icon">📗</span>
              <label for="storesExcel">Upload Stores Excel (.xlsx / .xls / .csv)</label>
            </div>
            <div class="upload-input-shell">
              <input type="file" id="storesExcel" accept=".xlsx,.xls,.csv">
            </div>
          </div>

          <div class="upload-card">
            <div class="upload-card-heading">
              <span class="upload-card-icon">📄</span>
              <label for="templateUpload">Upload Custom Template</label>
            </div>
            <div class="upload-input-shell">
              <input type="file" id="templateUpload" accept="image/*">
            </div>
          </div>

          <div class="upload-card">
            <div class="upload-card-heading">
              <span class="upload-card-icon">📄</span>
              <label for="templateUploadPrimary">Primary Template (English)</label>
            </div>
            <div class="upload-input-shell">
              <input type="file" id="templateUploadPrimary" class="template-upload-small" accept="image/*">
            </div>
          </div>

          <div class="upload-card">
            <div class="upload-card-heading">
              <span class="upload-card-icon">🌐</span>
              <label for="templateUploadSecondary">Secondary Template (Local Language)</label>
            </div>
            <div class="upload-input-shell">
              <input type="file" id="templateUploadSecondary" class="template-upload-small" accept="image/*">
            </div>
          </div>
        </div>
      </section>                                                                             

      <section class="footer-customization-section">
        <h3 class="footer-customization-title">Footer Customization</h3>

        <div class="footer-customization-grid">
          <div class="footer-field">
            <label for="footerName">Footer Text:</label>
            <div class="footer-input-shell">
              <input type="text" id="footerName" placeholder="Store Name">
            </div>
          </div>

          <div class="footer-field footer-field-color">
            <label for="footerWhatsApp">WhatsApp Number:</label>
            <div class="whatsapp-color-wrap footer-input-shell">
              <input type="text" id="footerWhatsApp" placeholder="Enter WhatsApp Number">
            </div>
          </div>
        </div>

        <div class="footer-action-row">
          <div class="footer-action-left">
            <button type="button" class="btn-success" onclick="updateFooterInfo()">Update Footer</button>
            <button type="button" class="btn-light" onclick="applyFooterColor()">Footer Move</button>
          </div>
          <div class="footer-action-right">
          </div>
        </div>
      </section>

      <div class="template-upload-grid">
          <div style="margin-top: 15px; padding: 12px; background: #f5f5f5; border-radius: 4px;">
            <label style="font-weight:700; display: block; margin-bottom: 10px;">Template Footer Position:</label>
            <input type="radio" name="footer_position" id="footer_default" value="footer_only" onchange="adjustFooterPosition();">
            <label for="footer_default">Footer Only</label>&nbsp;&nbsp;
            <input type="radio" name="footer_position" id="footer_below" value="below_template" onchange="adjustFooterPosition();">
            <label for="footer_below">Below Template</label>&nbsp;&nbsp;
            <input type="radio" name="footer_position" id="footer_more_down" value="more_down" checked onchange="adjustFooterPosition();">
            <label for="footer_more_down">More Down</label>
          </div>

        <div class="template-upload-col">
          <div id="primaryTemplateBox" class="preview-box"></div>
        </div>

        <div class="template-upload-col">
          <div id="secondaryTemplateBox" class="preview-box"></div>
        </div>
      </div>
    </section>

    <section class="panel-card">
      <h2 class="section-title">Live Template</h2>
      <div style="margin-bottom: 12px;">
        <label for="footerTextColor">Footer Text Color:</label>
        <input type="color" id="footerTextColor" value="#9A6C0C" aria-label="Footer Text & Logo Color">
      </div>
      <div id="templateBox" class="template-box lang-en more-down">
        <div id="storeFooterName">Default Store Name</div>
        <div id="storeFooter"></div>
      </div>
    </section>

    <section class="panel-card">
      <h2 class="section-title">Generated Templates</h2>
      <div id="templatesContainer"></div>
    </section>

    <script>
      // Ensure footer placement is correct on initial load
      document.addEventListener('DOMContentLoaded', function(){
        try{ if (typeof adjustFooterPosition === 'function') adjustFooterPosition(); }catch(e){}
      });
    </script>

    <section class="panel-card">
      <h2 class="section-title">Templates</h2>
      <div class="thumbnail-slider" id="templateSlider"></div>

      <h2 class="section-title">Products</h2>
      <div class="thumbnail-slider" id="productSlider"></div>

      <h2 class="section-title">Banners</h2>
      <div class="thumbnail-slider" id="bannerSlider"></div>
    </section>
  </main>

  <script src="/static/js/marketing-template.js"></script>
</body>
</html>
